>'+i+'</span>'+w(k)+'</button>').join('');let out='';const a=get();if(tab==='home'){out='<div class="screen"><section class="hero"><span class="eyebrow">PonteDom · Italia</span><h1 class="h1">'+w('hero')+'</h1><p class="muted">'+w('sub')+'</p><button class="btn" onclick="go(\'offers\')">'+w('explore')+' →</button></section>'+inputFilters()+'<h2 class="section-title">'+w('featured')+'</h2>'+listingBlock(all.slice(0,4))+'<button class="btn secondary full" onclick="go(\'offers\')">'+w('all')+' →</button><h2 class="section-title">'+w('findHelp')+'</h2><div class="panel"><p class="muted">'+w('findHelpText')+'</p><button class="btn" onclick="go(\'request\')">'+w('request')+'</button></div></div>'}if(tab==='offers'){out='<div class="screen"><span class="eyebrow">PonteDom · Italia</span><h1 class="h1">'+w('all')+'</h1>'+inputFilters()+'<div class="toolbar"><span class="status">'+w('results')+': '+(loadState==='ready'?a.length:'—')+'</span><div class="seg"><button class="'+(view==='cards'?'on':'')+'" onclick="setView(\'cards\')">▦</button><button class="'+(view==='list'?'on':'')+'" onclick="setView(\'list\')">☷</button></div></div>'+listingBlock(a)+'</div>'}if(tab==='saved'){out='<div class="screen"><h1 class="h1">'+w('saved')+'</h1><p class="muted">'+w('privacy')+'</p>'+listingBlock(all.filter(p=>favorites.includes(p.id)))+(favorites.length===0?'<div class="empty">♡<br>'+w('savedEmpty')+'</div>':'')+'</div>'}if(tab==='map'){out='<div class="screen"><div class="row"><h1 class="h1">'+w('map')+'</h1><button class="btn secondary" onclick="go(\'offers\')">▤ '+w('offers')+'</button></div><div id="map" class="map"></div><p class="muted">'+w('source')+'</p>'+(loadState==='error'?'<div class="error">'+w('error')+' <button class="btn secondary" onclick="load()">'+w('retry')+'</button></div>':'')+'</div>'}if(tab==='detail'&&selected){const p=selected;out='<div class="screen"><button class="back" onclick="go(\'offers\')">← '+w('all')+'</button><img class="detail-hero" src="'+esc(p.images[imgIndex])+'" alt="'+esc(p.title)+'" onerror="this.src=\''+DEFAULT_IMG+'\'"><div class="imgnav"><button onclick="imgStep(-1)">←</button><span class="status">'+(imgIndex+1)+' / '+p.images.length+'</span><button onclick="imgStep(1)">→</button></div><h1 class="h1">'+esc(p.title)+'</h1><div class="location">⌖ '+esc(p.location)+'</div><div class="row"><div class="price">'+esc(p.price?fmt(p.price):p.priceText||'—')+'</div><button class="heart '+(favorites.includes(p.id)?'on':'')+'" onclick="toggleFav('+JSON.stringify(p.id).replace(/"/g,'&quot;')+')">'+(favorites.includes(p.id)?'♥':'♡')+'</button></div><div class="panel" style="margin-top:14px"><div class="stats"><span>▣ '+esc(p.area||'—')+' m²</span><span>♧ '+esc(p.beds||'—')+' '+w('beds')+'</span><span>◫ '+esc(p.baths||'—')+' '+w('baths')+'</span></div><p class="muted">'+esc(p.desc)+'</p></div>'+(p.url?'<p><a href="'+esc(p.url)+'" target="_blank" rel="noopener noreferrer">'+w('external')+' ↗</a></p>':'')+'<h2 class="section-title">'+w('contact')+'</h2>'+formHtml(false)+'</div>'}if(tab==='request'){out='<div class="screen"><button class="back" onclick="go(\'home\')">← '+w('home')+'</button><h1 class="h1">'+w('request')+'</h1><p class="muted">'+w('findHelpText')+'</p>'+formHtml(true)+'</div>'}if(tab==='more'){out='<div class="screen"><h1 class="h1">'+w('about')+'</h1><div class="panel"><h2 class="section-title">'+w('audit')+'</h2><p class="muted">'+w('auditText')+'</p><button class="btn" onclick="go(\'request\')">'+w('request')+'</button></div><div class="quick" style="margin-top:15px"><button onclick="go(\'map\')"><span class="ico">♧</span>'+w('map')+'</button><button onclick="go(\'offers\')"><span class="ico">▤</span>'+w('offers')+'</button></div><p class="foot">PonteDom · <a href="https://pontedom.pl/" target="_blank" rel="noopener">pontedom.pl</a></p><button class="btn secondary full" onclick="load()">'+w('reload')+'</button></div>'}$('app').innerHTML=out;if(tab==='map')setTimeout(initMap,80)}function formHtml(find){return '<form class="form panel" onsubmit="submitInquiry(event,'+(find?'true':'false')+')"><label class="label">'+w('name')+'</label><input class="field" name="name" required autocomplete="name"><label class="label">'+w('email')+'</label><input class="field" type="email" name="email" required autocomplete="email"><label class="label">'+w('phone')+'</label><input class="field" type="tel" name="phone" autocomplete="tel"><label class="label">'+w('message')+'</label><textarea class="field" name="message" required></textarea><button class="btn full" type="submit">'+w('send')+' →</button></form>'}async function submitInquiry(e,find){e.preventDefault();const f=e.target,button=f.querySelector('button[type=submit]');button.disabled=true;const d=Object.fromEntries(new FormData(f));if(!find&&selected){d.property=text(selected.title);d.propertyId=selected.id;d.propertyUrl=selected.url||location.href}try{const r=await fetch(find?FIND_FORM:FORM,{method:'POST',headers:{'Content-Type':'application/json','Accept':'application/json'},body:JSON.stringify(d)});if(!r.ok)throw Error('HTTP '+r.status);f.reset();notice(w('sent'))}catch(err){console.error(err);notice(w('failed'))}finally{button.disabled=false}}function initMap(){if(tab!=='map')return;if(typeof L==='undefined'){setTimeout(initMap,500);return}if(map){map.remove();map=null}map=L.map('map',{attributionControl:false,zoomControl:true}).setView([42.75,13.95],6);L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png',{maxZoom:19}).addTo(map);markers=L.layerGroup().addTo(map);const pts=[];get().forEach(p=>{if(!p.coords)return;const icon=L.divIcon({className:'',html:'<div class="marker">'+esc(p.price?fmt(p.price):p.priceText||'⌂')+'</div>',iconSize:[110,36],iconAnchor:[55,18]});const m=L.marker(p.coords,{icon}).addTo(markers);m.bindPopup('<strong>'+esc(p.title)+'</strong><br>'+esc(p.location)+'<br><button class="btn" style="margin-top:8px" onclick="detail('+JSON.stringify(p.id).replace(/"/g,'&quot;')+')">'+w('details')+'</button>');pts.push(p.coords)});if(pts.length)map.fitBounds(pts,{padding:[25,25],maxZoom:12});else L.popup().setLatLng([42.75,13.95]).setContent(w('emptyMap')).openOn(map);setTimeout(()=>map&&map.invalidateSize(),200)}load();
</script></body></html>
