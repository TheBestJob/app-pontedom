<!doctype html><html lang="pl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#174b46"><title>PonteDom — mobilna aplikacja</title><style>
:root{font-family:Inter,system-ui,sans-serif;color:#183b37;background:#e9efed}*{box-sizing:border-box}body{margin:0}button,input,select{font:inherit}button{cursor:pointer}.app{max-width:460px;margin:auto;min-height:100dvh;background:#f7faf8;padding-bottom:90px;box-shadow:0 0 30px #1235}.hero{background:linear-gradient(135deg,#164b45,#287c68);color:white;padding:25px 22px 36px;border-radius:0 0 28px 28px}.top{display:flex;justify-content:space-between;align-items:center}.brand{font-size:23px;font-weight:800}.brand span{color:#bce7d4}.lang{background:#ffffff25;color:white;border:1px solid #ffffff55;border-radius:10px;padding:9px}.hero h1{font-size:27px;margin:30px 0 8px}.hero p{font-size:14px;color:#e2f4ec;margin:0;line-height:1.5}.body{padding:18px}.search{background:white;border-radius:20px;padding:17px;margin-top:-35px;position:relative;box-shadow:0 9px 26px #173e3920}.search label{font-size:12px;font-weight:700;display:block;margin:12px 0 6px}.search input,.search select{width:100%;border:1px solid #d9e5e0;border-radius:11px;padding:12px;background:#fff;color:#21443f}.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}.primary{background:#186a57;color:white;border:0;border-radius:12px;padding:13px;font-weight:750;width:100%;margin-top:15px}.outline{background:#e4f2eb;color:#186a57;border:0;border-radius:12px;padding:12px;font-weight:700}.section{display:flex;align-items:center;justify-content:space-between;margin:24px 0 13px}.section h2{font-size:19px;margin:0}.tiles{display:grid;grid-template-columns:1fr 1fr;gap:12px}.tile{background:white;border:1px solid #e0ebe5;border-radius:18px;padding:18px;text-align:left;min-height:135px}.tile .emoji{font-size:28px;display:block;margin-bottom:14px}.tile b{display:block;font-size:15px}.tile small{display:block;color:#698078;margin-top:5px;line-height:1.4}.card{background:white;border:1px solid #e1ebe6;border-radius:17px;padding:17px;margin:12px 0}.card h3{margin:0 0 8px;font-size:16px}.card p{font-size:13px;color:#61776f;line-height:1.55}.row{display:flex;align-items:center;justify-content:space-between;gap:10px}.bottom{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:100%;max-width:460px;display:flex;justify-content:space-around;background:#fff;border-top:1px solid #e0e9e4;padding:9px 2px max(11px,env(safe-area-inset-bottom));z-index:5}.bottom button{background:none;border:0;color:#6d8179;font-size:11px;min-width:55px}.bottom button b{display:block;font-size:23px;margin-bottom:4px}.bottom button.active{color:#176c58;font-weight:800}.pill{background:#e6f3eb;border-radius:30px;padding:5px 9px;font-size:11px;color:#1c705a}.muted{color:#667d74;font-size:13px;line-height:1.6}.back{border:0;background:#e6f3eb;color:#185e4e;border-radius:10px;padding:10px}.empty{padding:26px;text-align:center;color:#7b8e85}.notice{font-size:12px;color:#765d2a;background:#fff7e5;padding:13px;border-radius:12px;line-height:1.5;margin-top:15px}a{color:#126852}button:focus-visible,a:focus-visible,input:focus-visible,select:focus-visible{outline:3px solid #75c7a5;outline-offset:2px}@media(min-width:520px){.app{margin:24px auto;border-radius:25px;overflow:hidden;min-height:880px}}
</style></head><body><div class="app"><header class="hero"><div class="top"><div class="brand">⌂ Ponte<span>Dom</span></div><select class="lang" id="lang" aria-label="Language"><option value="pl">PL</option><option value="en">EN</option><option value="it">IT</option></select></div><h1 id="title"></h1><p id="subtitle"></p></header><main class="body" id="content"></main><nav class="bottom" id="nav"></nav></div><script>
'use strict';const site='https://pontedom.pl/';const i18n={pl:{hello:'Znajdź swoje miejsce',sub:'Nieruchomości i możliwości w jednym miejscu.',home:'Start',search:'Szukaj',saved:'Zapisane',contact:'Kontakt',more:'Więcej',find:'Wyszukaj nieruchomość',city:'Lokalizacja',kind:'Rodzaj',any:'Dowolny',apartment:'Mieszkanie',house:'Dom',land:'Działka',commercial:'Lokal',budget:'Budżet maks. (PLN)',go:'Przeglądaj oferty na PonteDom',quick:'Na skróty',browse:'Wszystkie oferty',map:'Mapa ofert',sell:'Dodaj ofertę',recent:'Twoje wyszukiwania',save:'Zapisz wyszukiwanie',clear:'Usuń',noSaved:'Nie masz jeszcze zapisanych wyszukiwań.',open:'Otwórz stronę PonteDom',about:'O aplikacji',disclaimer:'To wersja demonstracyjna. Aktualne oferty, zdjęcia i ceny dostępne są na pontedom.pl. Wyszukiwanie otwiera witrynę źródłową; filtry zapisują się lokalnie.',send:'Wyślij zapytanie',email:'Adres e-mail',message:'Wiadomość',your:'Twoje imię',favorites:'Ulubione',favoritesNote:'Zapisywanie konkretnych ofert będzie dostępne po podłączeniu danych ofert z PonteDom.',settings:'Ustawienia',privacy:'Wyczyść zapisane dane',tip:'Oferty są zawsze aktualizowane na stronie PonteDom.'},en:{hello:'Find your place',sub:'Properties and opportunities in one place.',home:'Home',search:'Search',saved:'Saved',contact:'Contact',more:'More',find:'Find a property',city:'Location',kind:'Type',any:'Any',apartment:'Apartment',house:'House',land:'Land',commercial:'Commercial',budget:'Max budget (PLN)',go:'Browse listings on PonteDom',quick:'Quick access',browse:'All listings',map:'Property map',sell:'Post a listing',recent:'Your searches',save:'Save search',clear:'Remove',noSaved:'No saved searches yet.',open:'Open PonteDom website',about:'About this app',disclaimer:'This is a demo. Current listings, photos and prices are on pontedom.pl. Search opens the source website; criteria are saved locally.',send:'Send inquiry',email:'Email address',message:'Message',your:'Your name',favorites:'Favorites',favoritesNote:'Saving individual listings requires a property data integration with PonteDom.',settings:'Settings',privacy:'Clear saved data',tip:'Listings are kept up to date on PonteDom.'},it:{hello:'Trova il tuo posto',sub:'Immobili e opportunità in un unico posto.',home:'Home',search:'Cerca',saved:'Salvati',contact:'Contatti',more:'Altro',find:'Cerca un immobile',city:'Località',kind:'Tipologia',any:'Qualsiasi',apartment:'Appartamento',house:'Casa',land:'Terreno',commercial:'Commerciale',budget:'Budget massimo (PLN)',go:'Visualizza gli annunci su PonteDom',quick:'Accesso rapido',browse:'Tutti gli annunci',map:'Mappa immobili',sell:'Pubblica annuncio',recent:'Le tue ricerche',save:'Salva ricerca',clear:'Elimina',noSaved:'Nessuna ricerca salvata.',open:'Apri il sito PonteDom',about:"Informazioni sull'app",disclaimer:'Questa è una demo. Annunci, foto e prezzi aggiornati sono su pontedom.pl. La ricerca apre il sito originale; i criteri vengono salvati localmente.',send:'Invia richiesta',email:'Email',message:'Messaggio',your:'Nome',favorites:'Preferiti',favoritesNote:'Per salvare singoli immobili serve integrare i dati di PonteDom.',settings:'Impostazioni',privacy:'Cancella dati salvati',tip:'Gli annunci sono aggiornati sul sito PonteDom.'}};let language=localStorage.getItem('pd_language')||'pl',view='home';const $=s=>document.querySelector(s),t=k=>i18n[language][k]||k,esc=s=>String(s||'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));function read(){try{return JSON.parse(localStorage.getItem('pd_searches')||'[]')}catch{return []}}function openSite(){window.open(site,'_blank','noopener,noreferrer')}function go(v){view=v;render();window.scrollTo(0,0)}function searchForm(){return '<div class="search"><b>'+t('find')+'</b><label for="city">'+t('city')+'</label><input id="city" placeholder="Kraków / Warszawa / Milano"><div class="grid"><div><label for="kind">'+t('kind')+'</label><select id="kind"><option value="">'+t('any')+'</option>'+['apartment','house','land','commercial'].map(k=>'<option value="'+k+'">'+t(k)+'</option>').join('')+'</select></div><div><label for="budget">'+t('budget')+'</label><input id="budget" type="number" min="0" inputmode="numeric" placeholder="500000"></div></div><button class="primary" onclick="runSearch()">'+t('go')+' ↗</button><button class="outline" style="width:100%;margin-top:9px" onclick="saveSearch()">'+t('save')+' ☆</button></div>'}function criteria(){return {city:$('#city')?.value.trim()||'',kind:$('#kind')?.value||'',budget:$('#budget')?.value||''}}function saveSearch(){const c=criteria(),a=read();a.unshift({...c,date:new Date().toLocaleDateString(language)});localStorage.setItem('pd_searches',JSON.stringify(a.slice(0,20)));alert('✓ '+t('save'))}function runSearch(){saveSearch();openSite()}function removeSearch(i){const a=read();a.splice(i,1);localStorage.setItem('pd_searches',JSON.stringify(a));render()}function tile(emoji,key,fn){return '<button class="tile" onclick="'+fn+'"><span class="emoji">'+emoji+'</span><b>'+t(key)+'</b><small>↗</small></button>'}function render(){const names={home:'hello',search:'find',saved:'saved',contact:'contact',more:'more'};$('#title').textContent=t(names[view]);$('#subtitle').textContent=t('sub');$('#lang').value=language;let out='';if(view==='home'){out=searchForm()+'<div class="section"><h2>'+t('quick')+'</h2></div><div class="tiles">'+tile('🏘️','browse','openSite()')+tile('🗺️','map','openSite()')+tile('🔎','search',"go('search')")+tile('✉️','contact',"go('contact')")+'</div><div class="card"><h3>🏡 PonteDom</h3><p>'+t('tip')+'</p><button class="outline" onclick="openSite()">'+t('open')+' ↗</button></div>'}if(view==='search'){out=searchForm()+'<div class="notice">'+t('disclaimer')+'</div>'}if(view==='saved'){out='<div class="section"><h2>'+t('recent')+'</h2></div>';const a=read();out+=a.length?a.map((s,i)=>'<div class="card"><div class="row"><div><b>🔎 '+esc(s.city||t('any'))+'</b><p>'+esc(t(s.kind||'any'))+' · '+esc(s.budget||'—')+' PLN · '+esc(s.date)+'</p></div><button class="back" onclick="removeSearch('+i+')">'+t('clear')+'</button></div><button class="outline" onclick="openSite()">'+t('browse')+' ↗</button></div>').join(''):'<div class="empty">'+t('noSaved')+'</div>';out+='<div class="card"><h3>♡ '+t('favorites')+'</h3><p>'+t('favoritesNote')+'</p></div>'}if(view==='contact'){out='<div class="card"><h3>'+t('send')+'</h3><form id="inquiry"><label class="muted">'+t('your')+'</label><input required name="name" style="width:100%;padding:12px;margin:6px 0 14px;border:1px solid #ddd;border-radius:10px"><label class="muted">'+t('email')+'</label><input required type="email" name="email" style="width:100%;padding:12px;margin:6px 0 14px;border:1px solid #ddd;border-radius:10px"><label class="muted">'+t('message')+'</label><textarea required name="message" style="width:100%;min-height:115px;padding:12px;margin:6px 0;border:1px solid #ddd;border-radius:10px"></textarea><button class="primary" type="submit">'+t('send')+'</button></form></div><p class="muted">'+t('disclaimer')+'</p>'}if(view==='more'){out='<div class="card"><h3>'+t('about')+'</h3><p>'+t('disclaimer')+'</p></div><div class="card"><button class="outline" onclick="openSite()">'+t('open')+' ↗</button></div><div class="card"><h3>'+t('settings')+'</h3><button class="outline" onclick="if(confirm(\'Clear saved searches?\')){localStorage.removeItem(\'pd_searches\');render()}">'+t('privacy')+'</button></div>'}$('#content').innerHTML=out;$('#nav').innerHTML=[['home','⌂'],['search','⌕'],['saved','♡'],['contact','✉'],['more','☰']].map(([k,icon])=>'<button class="'+(view===k?'active':'')+'" onclick="go(\''+k+'\')"><b>'+icon+'</b>'+t(k)+'</button>').join('');if(view==='contact')$('#inquiry').addEventListener('submit',e=>{e.preventDefault();const f=new FormData(e.target);const subject=encodeURIComponent('PonteDom mobile inquiry');const body=encodeURIComponent('Name: '+f.get('name')+'\nEmail: '+f.get('email')+'\n\n'+f.get('message'));window.location.href='mailto:info@pontedom.pl?subject='+subject+'&body='+body})}$('#lang').addEventListener('change',e=>{language=e.target.value;localStorage.setItem('pd_language',language);render()});render();
</script></body></html>
