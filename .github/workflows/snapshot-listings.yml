name: Capture PonteDom listings snapshot
on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/snapshot-listings.yml'
permissions:
  contents: write
jobs:
  snapshot:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Download live listings once and store in repository
        env:
          API_URL: https://adriatica-backend.onrender.com/api/listings
        run: |
          python - <<'PY'
          import json, os, time, urllib.request
          url=os.environ['API_URL']
          error=None
          for attempt in range(8):
              try:
                  req=urllib.request.Request(url,headers={'User-Agent':'PonteDom-Snapshot/1.0','Accept':'application/json'})
                  with urllib.request.urlopen(req,timeout=90) as resp:
                      payload=json.load(resp)
                  if isinstance(payload,list):
                      listings=payload
                  elif isinstance(payload,dict) and isinstance(payload.get('listings'),list):
                      listings=payload['listings']
                  else:
                      raise ValueError('Unexpected API structure')
                  if not listings:
                      raise ValueError('API returned no listings; refusing to replace snapshot')
                  with open('listings.json','w',encoding='utf-8') as f:
                      json.dump(listings,f,ensure_ascii=False,indent=2)
                      f.write('\n')
                  print(f'Snapshot captured: {len(listings)} listings')
                  break
              except Exception as exc:
                  error=exc
                  print(f'Attempt {attempt+1}/8 failed: {exc}',flush=True)
                  if attempt<7: time.sleep(25)
          else:
              raise RuntimeError(f'Could not capture listings: {error}')
          PY
      - name: Commit captured static snapshot
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add listings.json
          if git diff --cached --quiet; then
            echo "Snapshot unchanged"
          else
            git commit -m "Save static PonteDom listings for demo"
            git push
          fi
